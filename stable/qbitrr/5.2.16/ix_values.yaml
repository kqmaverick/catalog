image:
  repository: docker.io/feramance/qbitrr
  pullPolicy: IfNotPresent
  tag: v5.14.6-1@sha256:9534ae1d0a4fc7255838c94069d35f5161e4f6995bad3168decedd1f656ca2ae
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      initContainers:
        1-create-config-file:
          type: install
          enabled: true
          imageSelector: "image"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              conf="/config/config.toml"
              if [ -f "$conf" ]; then
                echo "Existing configuration found; leaving it unchanged."
              else
                echo "Generating configuration with the installed qBitrr version."
                cd /config
                python -m qBitrr.main --gen-config
                test -s "$conf"
              fi
      containers:
        main:
          command:
            - /usr/bin/tini
            - --
            - python
            - -m
            - qBitrr.main
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
            QBITRR_OVERRIDES_DATA_PATH: /config
persistence:
  config:
    enabled: true
    mountPath: /config
    targetSelector:
      main:
        main: {}
        1-create-config-file: {}
  downloads:
    enabled: true
    mountPath: /completed_downloads
portal:
  open:
    enabled: false
