{{/* Make sure all variables are set properly */}}
{{- include "tc.v1.common.loader.init" . -}}

{{/* Preserve the existing SCALE form value while using Radarr 7 option names. */}}
{{- $env := .Values.workload.main.podSpec.containers.main.env -}}
{{- $method := get $env "RADARR__AUTH__METHOD" | default (get $env "RADARR__AUTHENTICATION_METHOD") | default "" -}}
{{- $_ := unset $env "RADARR__AUTHENTICATION_METHOD" -}}
{{- $port := get $env "RADARR__SERVER__PORT" | default (get $env "RADARR__PORT") -}}
{{- $_ := unset $env "RADARR__PORT" -}}
{{- if $port -}}
  {{- $_ := set $env "RADARR__SERVER__PORT" $port -}}
{{- end -}}
{{- if eq $method "Basic" -}}
  {{- $method = "Forms" -}}
{{- end -}}
{{- if $method -}}
  {{- $_ := set $env "RADARR__AUTH__METHOD" $method -}}
{{- else -}}
  {{- $_ := unset $env "RADARR__AUTH__METHOD" -}}
{{- end -}}

{{/* Native OIDC is opt-in and takes precedence over legacy auth overrides. */}}
{{- $oidc := .Values.radarr.oidc -}}
{{- if $oidc.enabled -}}
  {{- if not (hasPrefix "https://" $oidc.authority) -}}
    {{- fail "Radarr OIDC authority must use https://." -}}
  {{- end -}}
  {{- if or (not (trim $oidc.client_id)) (not (trim $oidc.user_identifier)) -}}
    {{- fail "Radarr OIDC requires a client ID and authorized verified email or subject." -}}
  {{- end -}}
  {{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $oidc.client_secret_name)) (gt (len $oidc.client_secret_name) 253) -}}
    {{- fail "Radarr OIDC requires a valid existing Kubernetes Secret name." -}}
  {{- end -}}
  {{- if not (regexMatch "^[-._a-zA-Z0-9]+$" $oidc.client_secret_key) -}}
    {{- fail "Radarr OIDC requires a nonempty valid Secret key." -}}
  {{- end -}}
  {{- if not (has "openid" (regexSplit "[ ,]+" $oidc.scopes -1)) -}}
    {{- fail "Radarr OIDC scopes must include openid." -}}
  {{- end -}}
  {{/* Clear the obsolete auth-enabled switch which otherwise forces Forms. */}}
  {{- $_ := set $env "RADARR__AUTH__ENABLED" "false" -}}
  {{- $_ := set $env "RADARR__AUTH__METHOD" "Oidc" -}}
  {{- $_ := set $env "RADARR__AUTH__REQUIRED" "Enabled" -}}
  {{- $_ := set $env "RADARR__AUTH__OIDCAUTHORITY" $oidc.authority -}}
  {{- $_ := set $env "RADARR__AUTH__OIDCCLIENTID" $oidc.client_id -}}
  {{- $_ := set $env "RADARR__AUTH__OIDCUSERIDENTIFIER" $oidc.user_identifier -}}
  {{- $_ := set $env "RADARR__AUTH__OIDCSCOPES" $oidc.scopes -}}
  {{- $_ := set $env "RADARR__AUTH__OIDCCLIENTSECRET" (dict "secretKeyRef" (dict "expandObjectName" false "name" $oidc.client_secret_name "key" $oidc.client_secret_key)) -}}
{{- end -}}

{{/* Disable [exportarr] if requested */}}
{{- if not .Values.metrics.main.enabled -}}
  {{- $_ := set .Values.workload.exportarr "enabled" false -}}
  {{- $_ := set .Values.service.metrics "enabled" false -}}
{{- end -}}

{{/* Render the templates */}}
{{- include "tc.v1.common.loader.apply" . -}}
