image:
  repository: brandawg93/peanut
  tag: 6.0.0@sha256:6629dce915da8b313f08b2e73dd2e54b60e7c0f642c21a8ebc37fe0a820bf41e
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10688
portal:
  open:
    enabled: true
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/ping
            readiness:
              type: http
              path: /api/ping
            startup:
              type: http
              path: /api/ping
          env:
            AUTH_DISABLED: true
            NUT_HOST: "localhost"
            NUT_PORT: 3493
            USERNAME: ""
            PASSWORD: ""
            WEB_PORT: "{{ .Values.service.main.ports.main.port }}"
persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    size: 1Gi
