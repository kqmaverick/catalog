image:
  repository: brandawg93/peanut
  tag: 6.1.0@sha256:e5f2fbce02e1912e984be738a206255d8ab51632e6327d1a06b06dc1bb82231e
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 10688
portal:
  open:
    enabled: true
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/ping
            readiness:
              type: http
              path: /api/ping
            startup:
              type: http
              path: /api/ping
          env:
            AUTH_DISABLED: true
            NUT_HOST: "localhost"
            NUT_PORT: 3493
            USERNAME: ""
            PASSWORD: ""
            WEB_PORT: "{{ .Values.service.main.ports.main.port }}"
persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    size: 1Gi
