{{/* Refresh only the exact retired library image default retained in saved values. */}}
{{- $legacyGluetun := dict "repository" "tccr.io/tccr/gluetun" "tag" "v3.38.0@sha256:1c93687d1ba957252d11c29a741d56f3dca3765dbe666ed8595e71816e964452" "pullPolicy" "IfNotPresent" -}}
{{- if deepEqual .Values.gluetunImage $legacyGluetun -}}
  {{- $_ := set .Values "gluetunImage" (dict "repository" "docker.io/qmcgaw/gluetun" "tag" "v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027" "pullPolicy" "IfNotPresent") -}}
{{- end -}}

{{/* Make sure all variables are set properly */}}
{{- include "tc.v1.common.loader.init" . }}

{{/* Disable [qbitportforward] if requested */}}
{{- if not .Values.qbitportforward.enabled -}}
  {{- $_ := set .Values.workload.qbitportforward "enabled" false -}}
  {{- $_ := set .Values.service.gluetun "enabled" false -}}
{{- end -}}

{{/* Server data storage is used only with the Gluetun VPN addon. */}}
{{- if ne .Values.addons.vpn.type "gluetun" -}}
  {{- $_ := set .Values.persistence.gluetun "enabled" false -}}
{{- end -}}

{{/* Render the templates */}}
{{ include "tc.v1.common.loader.apply" . }}
